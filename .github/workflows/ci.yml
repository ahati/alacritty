name: CI

on: [push, pull_request, workflow_dispatch]

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      # Every platform reports on its own, so one leg's failure does not
      # cancel the others and hide what they would have said.
      fail-fast: false
      matrix:
        include:
          # Linux, both architectures the release ships.
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          # Windows, both architectures the release ships. The arm64 runner
          # has no Rust preinstalled, so the x64 installer is run under
          # emulation, which sets up the native aarch64 toolchain.
          - os: windows-latest
          - os: windows-11-arm
          # macOS aarch64 only.
          - os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install cmake pkg-config libfreetype6-dev libfontconfig1-dev \
            libxcb-xfixes0-dev libxkbcommon-dev python3 scdoc
      - name: Install Rust
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        run: |
          curl -sSfL -o rustup-init.exe https://win.rustup.rs/x86_64
          ./rustup-init.exe -y --default-toolchain stable
          echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
      - name: Stable
        run: cargo test
      - name: Stable (no default features)
        run: cargo test -p alacritty_terminal --no-default-features
      - name: Oldstable
        run: |
          rustup default $(cat Cargo.toml | grep "rust-version" | sed 's/.*"\(.*\)".*/\1/')
          cargo test
      - name: Clippy
        run: |
          rustup component add clippy
          cargo clippy --all-targets

  # The Windows code paths are also exercised under Wine, which runs the
  # gnu-target test binaries on a Linux runner. The tests are console ones
  # and need no display; xvfb stands in for one anyway, so that nothing the
  # loader probes can stall the run waiting for a screen.
  windows-gnu-wine:
    runs-on: ubuntu-latest

    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUNNER: xvfb-run -a wine64
      WINEDEBUG: -all

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install --no-install-recommends wine64 gcc-mingw-w64-x86-64 xvfb
      - name: Install target
        run: rustup target add x86_64-pc-windows-gnu
      - name: Test
        run: cargo test -p alacritty_terminal --target x86_64-pc-windows-gnu
