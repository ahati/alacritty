[workspace]
members = [
    "alacritty",
    "alacritty_terminal",
    "alacritty_config",
    "alacritty_config_derive",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85.0"

[profile.release]
strip = "symbols"
lto = "thin"
debug = 1
incremental = false

[workspace.dependencies]
toml = "0.9.11"
toml_edit = "0.24.0"

# TODO: Validation of fix for #6978. Remove before next release and use released `x11-clipboard`.
[patch.crates-io]
x11-clipboard = { git = "https://github.com/quininer/x11-clipboard.git", rev = "19ab2163cf0bd0db607e827a5214571990307866" }

# Streaming APC (`ESC _`) callbacks and unknown-OSC dispatch, required by the
# Kitty graphics and clipboard protocols. Upstream vte 0.15.0 drops APC payloads
# before they reach the terminal, and has no hook for OSC numbers it ignores.
vte = { git = "https://github.com/ahati/vte.git", branch = "kitty-graphics" }

# GlyphId rasterization and `font_path` lookup, required for text shaping.
# Based on alacritty/crossfont#35 by fee1-dead.
crossfont = { git = "https://github.com/ahati/crossfont", branch = "ligatures" }
